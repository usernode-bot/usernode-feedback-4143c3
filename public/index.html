<!DOCTYPE html>
<html lang="en" class="dark">
<script>
  try {
    var stored = localStorage.getItem('theme');
    if (stored === 'light') document.documentElement.classList.remove('dark');
    else document.documentElement.classList.add('dark');
  } catch (_) {}
</script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Usernode Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    #battery-fill { transition: width 0.35s ease, fill 0.35s ease; }
    #toast { transition: opacity 0.25s ease, transform 0.25s ease; }
    #toast.toast-hidden { opacity: 0; transform: translateY(8px); pointer-events: none; }
    #toast.toast-visible { opacity: 1; transform: translateY(0); }
    @keyframes starFloat {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to   { transform: translateY(-90px) scale(0.6); opacity: 0; }
    }
    .star-particle {
      animation: starFloat 0.6s ease-out forwards;
    }
    @keyframes rainbowCycle {
      0%   { background-color: #ff0000; box-shadow: 0 10px 30px rgba(255,0,0,0.4); }
      14%  { background-color: #ff7700; box-shadow: 0 10px 30px rgba(255,119,0,0.4); }
      28%  { background-color: #ffff00; box-shadow: 0 10px 30px rgba(255,255,0,0.4); }
      42%  { background-color: #00cc00; box-shadow: 0 10px 30px rgba(0,204,0,0.4); }
      57%  { background-color: #0000ff; box-shadow: 0 10px 30px rgba(0,0,255,0.4); }
      71%  { background-color: #4b0082; box-shadow: 0 10px 30px rgba(75,0,130,0.4); }
      85%  { background-color: #8b00ff; box-shadow: 0 10px 30px rgba(139,0,255,0.4); }
      100% { background-color: #ff0000; box-shadow: 0 10px 30px rgba(255,0,0,0.4); }
    }
    #press-btn {
      animation: rainbowCycle 4s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .star-particle {
        animation-duration: 0.01s;
      }
    }
  </style>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col items-center justify-center gap-8 p-4 relative">

  <button id="theme-toggle" class="absolute top-4 right-4 rounded-full p-2 text-zinc-400 hover:text-teal-600 dark:hover:text-teal-400 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-500" aria-label="Toggle dark mode">
    <!-- Moon icon: shown in dark mode -->
    <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" />
    </svg>
    <!-- Sun icon: shown in light mode -->
    <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m8.66-9H21M3 12H2m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 7a5 5 0 100 10A5 5 0 0012 7z" />
    </svg>
  </button>

  <h1 class="text-2xl font-bold">Usernode Feedback</h1>

  <button id="press-btn" class="w-32 h-32 rounded-full active:scale-95 transition-all text-white text-xl font-bold shadow-lg shadow-teal-600/30 focus:outline-none focus-visible:ring-4 focus-visible:ring-teal-400/60">
    Press!
  </button>

  <!-- Energy display: battery icon + text readout -->
  <div class="flex flex-col items-center gap-1.5">
    <svg width="64" height="28" viewBox="0 0 64 28" aria-hidden="true">
      <!-- nub -->
      <rect x="56" y="9" width="8" height="10" rx="2" fill="currentColor" class="text-zinc-400 dark:text-zinc-600"/>
      <!-- body outline -->
      <rect x="0" y="2" width="54" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="2" class="text-zinc-400 dark:text-zinc-600"/>
      <!-- fill: x=3 y=5, max-width=48 -->
      <rect id="battery-fill" x="3" y="5" width="48" height="18" rx="2" fill="#22c55e"/>
    </svg>
    <div id="energy-text" class="text-sm text-zinc-500 dark:text-zinc-400">100 / 100 energy</div>
    <div id="energy-countdown" class="text-xs text-zinc-400 dark:text-zinc-500">Energy full</div>
    <div id="energy-speed" class="text-xs text-zinc-400 dark:text-zinc-500">+1 energy every 30s</div>
  </div>

  <div id="count" class="text-lg text-zinc-500 dark:text-zinc-400">0 total presses</div>

  <div id="rate-msg" class="text-sm text-amber-600 dark:text-amber-400 h-5 transition-opacity opacity-0"></div>

  <div class="w-full max-w-sm">
    <h2 class="text-sm font-semibold text-teal-600 dark:text-teal-400 mb-2 text-center">Leaderboard</h2>
    <div id="leaderboard" class="space-y-1"></div>
  </div>

  <!-- Toast notification (bottom-right, slides up on show) -->
  <div id="toast" class="toast-hidden fixed bottom-4 right-4 max-w-xs bg-zinc-900 text-white text-sm px-4 py-3 rounded-lg border border-zinc-700 shadow-lg cursor-pointer z-50" role="alert">
    <span id="toast-msg"></span>
  </div>

  <script>
    // Cap and regen rate are driven by the API payload; these are just
    // first-paint fallbacks until the first /api/energy response lands.
    let cap = 100;
    let regenInterval = 30;
    let currentEnergy = cap;
    let nextChargeAt = null; // epoch ms of the next +1, or null when full
    let countdownTimer = null;
    const MAX_FILL_WIDTH = 48;

    let audioCtx = null;

    function playClickSound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function spawnStar(x, y) {
      const star = document.createElement('span');
      star.textContent = '★';
      star.className = 'star-particle';
      star.style.cssText = [
        'position:fixed',
        'left:' + (x - 10) + 'px',
        'top:' + (y - 10) + 'px',
        'font-size:20px',
        'color:#facc15',
        'pointer-events:none',
        'z-index:9999',
        'user-select:none',
        'line-height:1',
      ].join(';');
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 620);
    }

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};
    const isDemo = params.get('demo') === '1';

    // Preserve the demo flag so the staging ?demo=1 preview stays synthetic
    // across fetches.
    const apiUrl = (path) => path + (isDemo ? (path.includes('?') ? '&' : '?') + 'demo=1' : '');

    let toastShownThisDepletion = false;

    // "M:SS" countdown to the next charge. Always non-negative.
    function formatCountdown(ms) {
      const total = Math.max(0, Math.ceil(ms / 1000));
      const m = Math.floor(total / 60);
      const s = total % 60;
      return m + ':' + String(s).padStart(2, '0');
    }

    // "30s" / "1m 30s" — human-readable regen rate.
    function formatInterval(sec) {
      if (sec < 60) return sec + 's';
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return s ? m + 'm ' + s + 's' : m + 'm';
    }

    function updateBattery(energy) {
      const pct = Math.max(0, Math.min(1, energy / cap));
      const fillEl = document.getElementById('battery-fill');
      fillEl.setAttribute('width', Math.round(pct * MAX_FILL_WIDTH));
      fillEl.setAttribute('fill', pct > 0.5 ? '#22c55e' : pct > 0.2 ? '#eab308' : '#ef4444');
    }

    function renderSpeedLabel() {
      document.getElementById('energy-speed').textContent =
        '+1 energy every ' + formatInterval(regenInterval);
    }

    // Guarded so a missing/`full` timestamp renders "Energy full", never NaN.
    function renderCountdown() {
      const el = document.getElementById('energy-countdown');
      if (currentEnergy >= cap || !nextChargeAt) {
        el.textContent = 'Energy full';
        return;
      }
      el.textContent = 'Next +1 in ' + formatCountdown(nextChargeAt - Date.now());
    }

    function renderEnergy() {
      updateBattery(currentEnergy);
      document.getElementById('energy-text').textContent = currentEnergy + ' / ' + cap + ' energy';
      setButtonEnabled(currentEnergy > 0);
      renderCountdown();
    }

    // Adopt an authoritative payload from the server.
    function applyEnergy(p) {
      if (typeof p.cap === 'number') cap = p.cap;
      if (typeof p.regen_interval_seconds === 'number') regenInterval = p.regen_interval_seconds;
      currentEnergy = p.energy;
      nextChargeAt = (p.full || !p.next_charge_at) ? null : new Date(p.next_charge_at).getTime();
      renderSpeedLabel();
      renderEnergy();
    }

    // One ticker drives the live countdown. When a charge is due we optimistically
    // bump the number and roll the anchor forward, then re-sync against the server
    // to correct any drift.
    function startCountdownLoop() {
      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        if (currentEnergy >= cap || !nextChargeAt) { renderCountdown(); return; }
        if (Date.now() >= nextChargeAt) {
          currentEnergy = Math.min(cap, currentEnergy + 1);
          nextChargeAt = currentEnergy >= cap ? null : nextChargeAt + regenInterval * 1000;
          if (currentEnergy > 0) toastShownThisDepletion = false;
          renderEnergy();
          loadEnergy(); // re-sync to server truth
        } else {
          renderCountdown();
        }
      }, 1000);
    }

    function setButtonEnabled(enabled) {
      const btn = document.getElementById('press-btn');
      btn.disabled = !enabled;
      if (enabled) {
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
        btn.classList.add('hover:bg-teal-500', 'active:scale-95');
      } else {
        btn.classList.add('opacity-50', 'cursor-not-allowed');
        btn.classList.remove('hover:bg-teal-500', 'active:scale-95');
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = message;
      toast.classList.remove('toast-hidden');
      toast.classList.add('toast-visible');
      const dismiss = () => {
        toast.classList.remove('toast-visible');
        toast.classList.add('toast-hidden');
        toast.onclick = null;
      };
      toast.onclick = dismiss;
      setTimeout(dismiss, 4000);
    }

    async function loadLeaderboard() {
      const res = await fetch('/api/leaderboard', { headers });
      if (!res.ok) return;
      const { leaderboard } = await res.json();
      const el = document.getElementById('leaderboard');
      if (!leaderboard.length) {
        el.innerHTML = '<p class="text-center text-zinc-400 dark:text-zinc-600 text-sm">No presses yet</p>';
        return;
      }
      // Top-three finishers get premium metallic sheens built from the
      // exact gold / silver / bronze base hexes (#FFD700 / #C0C0C0 / #CD7F32).
      // Each gradient runs a soft light highlight -> base -> dark edge at 135deg
      // for a subtle brushed-metal look; dark text keeps them legible in both
      // light and dark mode, and a tinted ring adds the elevated outline.
      const podium = [
        { // gold
          style: 'background:linear-gradient(135deg,#FFF1A8 0%,#FFD700 45%,#C9A227 100%);' +
                 'box-shadow:inset 0 0 0 1px rgba(201,162,39,0.55);',
          icon: '🥇',
        },
        { // silver
          style: 'background:linear-gradient(135deg,#F2F2F2 0%,#C0C0C0 45%,#8A8A8A 100%);' +
                 'box-shadow:inset 0 0 0 1px rgba(138,138,138,0.55);',
          icon: '🥈',
        },
        { // bronze
          style: 'background:linear-gradient(135deg,#E6B07F 0%,#CD7F32 45%,#8C551F 100%);' +
                 'box-shadow:inset 0 0 0 1px rgba(140,85,31,0.55);',
          icon: '🥉',
        },
      ];
      el.innerHTML = leaderboard.map((r, i) => {
        const p = podium[i];
        const rankLabel = p
          ? '<span>' + p.icon + '</span>'
          : '<span class="tabular-nums text-zinc-400 dark:text-zinc-500">' + (i + 1) + '.</span>';
        const rowAttrs = p
          ? 'class="flex items-center justify-between px-3 py-1.5 rounded-md font-medium text-zinc-900" style="' + p.style + '"'
          : 'class="flex items-center justify-between px-3 py-1.5 rounded-md text-zinc-600 dark:text-zinc-400"';
        return '<div ' + rowAttrs + '>' +
          '<span class="flex items-center gap-2"><span class="w-5 text-center">' + rankLabel + '</span>' +
          '<span>' + r.username + '</span></span>' +
          '<span class="font-mono">' + r.presses + '</span></div>';
      }).join('');
      const total = leaderboard.reduce((s, r) => s + parseInt(r.presses), 0);
      document.getElementById('count').textContent = total + ' total presses';
    }

    const rateMsg = document.getElementById('rate-msg');
    let rateMsgTimer = null;
    function showRateMsg(text) {
      rateMsg.textContent = text;
      rateMsg.classList.remove('opacity-0');
      if (rateMsgTimer) clearTimeout(rateMsgTimer);
      rateMsgTimer = setTimeout(() => rateMsg.classList.add('opacity-0'), 3000);
    }

    async function loadEnergy() {
      try {
        const res = await fetch(apiUrl('/api/energy'), { headers });
        if (!res.ok) return;
        const data = await res.json();
        applyEnergy(data);
      } catch {}
    }

    function depletionToast() {
      if (toastShownThisDepletion) return;
      toastShownThisDepletion = true;
      const eta = nextChargeAt ? ' Next +1 in ' + formatCountdown(nextChargeAt - Date.now()) + '.' : '';
      showToast('⚡ You\'re out of energy!' + eta);
    }

    document.getElementById('press-btn').addEventListener('click', async (event) => {
      playClickSound();
      spawnStar(event.clientX, event.clientY);
      try {
        const res = await fetch(apiUrl('/api/press'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
        });
        if (res.ok) {
          const data = await res.json();
          loadLeaderboard();
          applyEnergy(data);
          if (data.energy === 0) depletionToast();
        } else if (res.status === 429) {
          let data = null;
          try { data = await res.json(); } catch {}
          if (data && data.energy !== undefined) {
            applyEnergy(data);
            depletionToast();
          } else {
            const msg = (data && data.error) ? data.error : 'Please wait a moment before submitting again.';
            showRateMsg(msg);
          }
        } else if (res.status === 401) {
          document.getElementById('count').textContent = 'Sign in to press!';
        }
      } catch {}
    });

    // Dark mode toggle
    const themeToggle = document.getElementById('theme-toggle');
    const iconMoon = document.getElementById('icon-moon');
    const iconSun = document.getElementById('icon-sun');

    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        iconMoon.classList.remove('hidden');
        iconSun.classList.add('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        iconMoon.classList.add('hidden');
        iconSun.classList.remove('hidden');
      }
    }

    // Set initial icon state to match current theme (set by anti-FOUC script)
    applyTheme(document.documentElement.classList.contains('dark'));

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.classList.contains('dark');
      const next = !isDark;
      applyTheme(next);
      try { localStorage.setItem('theme', next ? 'dark' : 'light'); } catch (_) {}
    });

    // Backgrounded tabs throttle setInterval, so snap back to server truth
    // whenever the tab becomes visible again.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') loadEnergy();
    });

    renderSpeedLabel();
    startCountdownLoop();
    Promise.all([loadLeaderboard(), loadEnergy()]);
  </script>
</body>
</html>
